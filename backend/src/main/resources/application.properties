# =====================================================================
# TroiaFilmes - configuracao da aplicacao
#
# Base: o application.properties passado pelo professor. As diferencas
# estao comentadas abaixo, uma a uma.
#
# Valores no formato ${VARIAVEL:padrao} podem ser trocados por variavel de
# ambiente sem mexer neste arquivo. Sem a variavel, vale o padrao.
# =====================================================================
spring.application.name=troiafilmes

# O docker-compose na raiz do projeto sobe exatamente este banco: porta
# 5432, base "unesc", usuario "postgres". Assim a configuracao funciona
# igual em qualquer maquina da equipe, com ou sem PostgreSQL instalado.
#
# Se a 5432 ja estiver ocupada por um PostgreSQL instalado na maquina, rode
# com DB_PORT=5433 (o docker-compose le a mesma variavel). Usando o banco
# instalado no lugar do Docker, informe DB_USER e DB_PASSWORD dele.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/unesc
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:lab008r2}

# O Flyway e a unica fonte da verdade do schema; o Hibernate apenas confere
# se as entidades batem com as tabelas criadas pelas migrations. Se alguem
# mexer numa entidade e esquecer a migration, a aplicacao nao sobe.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Correcao: o nome da propriedade e "enabled", nao "enable".
# Escrito errado, o Spring ignora a linha em silencio -- funcionava por
# acidente, porque o Flyway ja vem ligado por padrao.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Os scripts tem acentuacao (nomes de categoria, sinopses). Sem declarar a
# codificacao, o Flyway usa a do sistema operacional e o Windows grava
# "Ficcao Cientifica" no lugar de "Ficção Científica".
spring.flyway.encoding=UTF-8

# A API e stateless: a conexao com o banco nao precisa ficar aberta ate a
# resposta ser escrita. Desligar tambem remove o aviso que o Spring emite
# ao subir a camada web.
spring.jpa.open-in-view=false

# JSON de resposta: campos nulos sao omitidos, e as datas saem no fuso do Brasil.
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=America/Sao_Paulo

# Primeira barreira contra upload grande: o Tomcat corta a requisicao antes
# de chegar ao service. A segunda barreira esta no ArmazenamentoService.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=4MB

server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------------ JWT
# Chave que assina os tokens. O valor depois dos dois-pontos e so para
# desenvolvimento: fora daqui, defina a variavel de ambiente JWT_SECRET.
# Quem conhece a chave consegue fabricar tokens validos.
troiafilmes.jwt.secret=${JWT_SECRET:troiafilmes-chave-de-desenvolvimento-troque-em-producao}
# Validade do token de acesso: 1 hora. Na Aula 9 eram 24 horas; com o
# refresh token, o token de acesso pode durar pouco sem incomodar o usuario.
troiafilmes.jwt.expiracao-segundos=${JWT_EXPIRACAO_SEGUNDOS:3600}
# Validade do refresh token: 7 dias.
troiafilmes.jwt.refresh-expiracao-segundos=${JWT_REFRESH_EXPIRACAO_SEGUNDOS:604800}

# ------------------------------------------------------------------ CORS
# Origens do frontend React autorizadas a chamar a API.
troiafilmes.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# --------------------------------------------------------- armazenamento
# Pasta das imagens enviadas pela administracao. Fica fora do JAR: conteudo
# enviado em tempo de execucao nao pertence ao artefato de build.
troiafilmes.armazenamento.diretorio=${UPLOAD_DIR:uploads}
troiafilmes.armazenamento.url-base=/uploads
troiafilmes.armazenamento.tamanho-maximo-bytes=2097152
troiafilmes.armazenamento.tipos-permitidos=image/jpeg,image/png,image/webp

# ------------------------------------------------------- Swagger/OpenAPI
# Ligados de proposito: a documentacao interativa faz parte da entrega.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.api-docs.path=/v3/api-docs

# ------------------------------------------------------------------ logs
logging.level.br.edu.unesc.troiafilmes=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
